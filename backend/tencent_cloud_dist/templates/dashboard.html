<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Network Packet Analyzer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #e0e0e0;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #ffffff; margin-bottom: 30px; }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            transition: background-color 0.3s, opacity 0.3s;
        }
        #start-btn { background-color: #43a047; color: white; }
        #stop-btn { background-color: #e53935; color: white; }
        #export-btn { background-color: #1e88e5; color: white; }
        button:disabled {
            background-color: #424242;
            color: #aaaaaa;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .stats, .charts { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px; 
            margin-bottom: 30px; 
        }
        .stat, .chart, .alerts-container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            text-align: center;
        }
        .stat h2, .chart h2, .alerts-header h2 { color: #ffffff; font-size: 16px; }
        .stat p { font-size: 24px; font-weight: bold; color: #ffffff; }
        .alert { padding: 12px; margin: 8px 0; border-radius: 4px; background-color: #3a1212; border-left: 4px solid #ff4444; color: #ff9999; }
        .alert-count { background: #ff3333; color: white; padding: 4px 10px; border-radius: 12px; font-size: 0.9em; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
            h1 { font-size: 24px; margin-bottom: 20px; }
            .stat h2 { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Network Packet Analyzer</h1>
        <div class="controls">
            <button id="start-btn">Start Capture</button>
            <button id="stop-btn" disabled>Stop Capture</button>
            <button id="export-btn" disabled>Export Report (PDF)</button>
        </div>

        <div class="alerts-container">
            <div class="alerts-header">
                <h2>Attack Alerts</h2>
                <span class="alert-count" id="alert-count">0</span>
            </div>
            <div id="alerts-list"></div>
        </div>

        <div class="stats">
            <div class="stat"><h2>TOTAL PACKETS</h2><p id="total-packets">0</p></div>
            <div class="stat"><h2>PACKETS PER SECOND</h2><p id="pps">0</p></div>
            <div class="stat"><h2>BANDWIDTH</h2><p id="bandwidth">0 KB/s</p></div>
            <div class="stat"><h2>ACTIVE CONNECTIONS</h2><p id="connections">0</p></div>
        </div>

        <div class="charts">
            <div class="chart"><h2>Protocol Distribution</h2><canvas id="protocol-chart"></canvas></div>
            <div class="chart"><h2>Top 10 Destination Ports</h2><canvas id="ports-chart"></canvas></div>
            <div class="chart"><h2>Packet Size Distribution</h2><canvas id="packet-size-chart"></canvas></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Debug Socket.IO connection
        // Connect to Socket.IO server with explicit URL
        const socket = io('http://127.0.0.1:5000', {
            transports: ['websocket', 'polling'],
            reconnectionAttempts: 5,
            reconnectionDelay: 1000
        });
        
        // Connection event handlers
        socket.on('connect', () => {
            console.log('Connected to server!');
            document.getElementById('total-packets').textContent = 'Connected';
        });
        
        socket.on('disconnect', () => {
            console.log('Disconnected from server');
            document.getElementById('total-packets').textContent = 'Disconnected';
        });
        
        socket.on('connect_error', (error) => {
            console.error('Connection error:', error);
            document.getElementById('total-packets').textContent = 'Connection Error';
        });
        
        socket.on('connection_response', (data) => {
            console.log('Server response:', data);
        });
        
        socket.on('capture_error', (data) => {
            console.error('Capture error:', data);
            alert(`Capture error: ${data.message}`);
            startBtn.disabled = false;
            stopBtn.disabled = true;
            exportBtn.disabled = false;
            document.getElementById('total-packets').textContent = 'Error';
        });
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const exportBtn = document.getElementById('export-btn');
        const alertCount = document.getElementById('alert-count');
        const alertsList = document.getElementById('alerts-list');

        let protocolChart, portsChart, packetSizeChart;

        function initializeCharts() {
            protocolChart = new Chart(document.getElementById('protocol-chart'), {
                type: 'bar', data: { labels: [], datasets: [{ label: 'Protocols', data: [], backgroundColor: 'rgba(54, 162, 235, 0.5)' }] },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });

            portsChart = new Chart(document.getElementById('ports-chart'), {
                type: 'bar', data: { labels: [], datasets: [{ label: 'Ports', data: [], backgroundColor: 'rgba(153, 102, 255, 0.5)' }] },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });

            packetSizeChart = new Chart(document.getElementById('packet-size-chart'), {
                type: 'line', data: { labels: [], datasets: [{ label: 'Packet Size', data: [], borderColor: 'rgba(75, 192, 192, 1)', tension: 0.1 }] },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });
        }

        initializeCharts();

        startBtn.addEventListener('click', () => {
            console.log('Sending start_capture event');
            socket.emit('start_capture');
            document.getElementById('total-packets').textContent = 'Starting capture...';
            // We'll wait for the capture_started event to update UI
        });

        stopBtn.addEventListener('click', () => {
            console.log('Sending stop_capture event');
            socket.emit('stop_capture');
            document.getElementById('total-packets').textContent = 'Stopping capture...';
            // We'll wait for the capture_stopped event to update UI
        });
        
        // Listen for capture confirmation events
        socket.on('capture_started', (data) => {
            console.log('Capture started:', data);
            startBtn.disabled = true;
            stopBtn.disabled = false;
            exportBtn.disabled = true;
            alertCount.textContent = '0';
            alertsList.innerHTML = '';
        });
        
        socket.on('capture_stopped', (data) => {
            console.log('Capture stopped:', data);
            startBtn.disabled = false;
            stopBtn.disabled = true;
            exportBtn.disabled = false;
        });

        exportBtn.addEventListener('click', async () => {
            try {
                // Show loading indicator
                exportBtn.textContent = 'Exporting...';
                exportBtn.disabled = true;
                
                // Use absolute URL with correct host
                const response = await fetch('http://127.0.0.1:5000/server_api/export-pdf');
                
                if (!response.ok) {
                    if (response.headers.get('content-type')?.includes('application/json')) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || `HTTP error! Status: ${response.status}`);
                    } else {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                }
                
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `network_analysis_${new Date().toISOString().replace(/:/g, '-')}.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                // Success message
                alert('PDF exported successfully!');
            } catch (error) {
                console.error('PDF Export Error:', error);
                alert(`Failed to export PDF: ${error.message}`);
            } finally {
                // Reset button
                exportBtn.textContent = 'Export PDF';
                exportBtn.disabled = false;
            }
        });
        
        // Listen for real-time updates from the server
        socket.on('update_stats', function(data) {
            document.getElementById('total-packets').textContent = data.total_packets;
            document.getElementById('pps').textContent = data.pps;
            document.getElementById('bandwidth').textContent = data.bandwidth + ' KB/s';
            document.getElementById('connections').textContent = data.connections;

            // Update protocol chart
            const protocols = data.protocols;
            protocolChart.data.labels = Object.keys(protocols);
            protocolChart.data.datasets[0].data = Object.values(protocols);
            protocolChart.update();

            // Update ports chart
            const ports = data.ports;
            const sortedPorts = Object.entries(ports)
                .sort(([,a], [,b]) => b - a)
                .slice(0, 10);
            portsChart.data.labels = sortedPorts.map(([port]) => port);
            portsChart.data.datasets[0].data = sortedPorts.map(([,count]) => count);
            portsChart.update();

            // Update packet size chart
            const packetSizes = data.packet_sizes;
            packetSizeChart.data.labels = Array.from({length: packetSizes.length}, (_, i) => i + 1);
            packetSizeChart.data.datasets[0].data = packetSizes;
            packetSizeChart.update();
        });

        socket.on('dos_alert', function(data) {
            const alertsList = document.getElementById('alerts-list');
            const alertCount = document.getElementById('alert-count');
            
            data.alerts.forEach(alert => {
                const alertElement = document.createElement('div');
                alertElement.className = 'alert';
                alertElement.textContent = `[${data.timestamp}] ${alert}`;
                alertsList.insertBefore(alertElement, alertsList.firstChild);
            });

            const currentCount = parseInt(alertCount.textContent);
            alertCount.textContent = currentCount + data.alerts.length;

            // Keep only the 10 most recent alerts
            while (alertsList.children.length > 10) {
                alertsList.removeChild(alertsList.lastChild);
            }
        });
    </script>
</body>
</html>
