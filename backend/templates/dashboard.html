<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Network Packet Analyzer</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: #121212; /* Dark background */
    color: #e0e0e0; /* Light text */
}

.container {
    max-width: 1200px;
    margin: 0 auto;
}

h1 {
    text-align: center;
    color: #ffffff;
    margin-bottom: 30px;
}

.controls {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    justify-content: center;
}

button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    border-radius: 4px;
    transition: background-color 0.3s, opacity 0.3s;
}

#start-btn {
    background-color: #43a047;
    color: white;
}

#stop-btn {
    background-color: #e53935;
    color: white;
}

#export-btn {
    background-color: #1e88e5;
    color: white;
}

button:disabled {
    background-color: #424242;
    color: #aaaaaa;
    cursor: not-allowed;
    opacity: 0.6;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.stat {
    background: #1e1e1e;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    text-align: center;
}

.stat h2 {
    margin: 0;
    font-size: 14px;
    color: #bbbbbb;
    text-transform: uppercase;
}

.stat p {
    margin: 10px 0 0;
    font-size: 24px;
    font-weight: bold;
    color: #ffffff;
}

.charts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 20px;
}

.chart {
    background: #1e1e1e;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

.chart h2 {
    margin: 0 0 20px;
    font-size: 16px;
    color: #ffffff;
}

.alerts-container {
    background: #1e1e1e;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    margin-bottom: 30px;
}

.alerts-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.alerts-header h2 {
    color: #ff6666;
    margin: 0;
}

.alert-count {
    background: #ff3333;
    color: white;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.9em;
}

.alert {
    padding: 12px;
    margin: 8px 0;
    border-radius: 4px;
    background-color: #3a1212;
    border-left: 4px solid #ff4444;
    color: #ff9999;
}

/* Scrollbar Customization (Optional) */
::-webkit-scrollbar {
    width: 10px;
}

::-webkit-scrollbar-track {
    background: #121212;
}

::-webkit-scrollbar-thumb {
    background: #333;
    border-radius: 5px;
}

::-webkit-scrollbar-thumb:hover {
    background: #555;
}

    </style>
</head>
<body>
    <div class="container">
        <h1>Network Packet Analyzer</h1>
        <div class="controls">
            <button id="start-btn">Start Capture</button>
            <button id="stop-btn" disabled>Stop Capture</button>
            <button id="export-btn" disabled>Export Report (PDF)</button>
        </div>

        <div class="alerts-container">
            <div class="alerts-header">
                <h2>Attack Alerts</h2>
                <span class="alert-count" id="alert-count">0</span>
            </div>
            <div id="alerts-list"></div>
        </div>

        <div class="stats">
            <div class="stat">
                <h2>TOTAL PACKETS</h2>
                <p id="total-packets">0</p>
            </div>
            <div class="stat">
                <h2>PACKETS PER SECOND</h2>
                <p id="pps">0</p>
            </div>
            <div class="stat">
                <h2>BANDWIDTH</h2>
                <p id="bandwidth">0 KB/s</p>
            </div>
            <div class="stat">
                <h2>ACTIVE CONNECTIONS</h2>
                <p id="connections">0</p>
            </div>
        </div>

        <div class="charts">
            <div class="chart">
                <h2>Protocol Distribution</h2>
                <canvas id="protocol-chart"></canvas>
            </div>
            <div class="chart">
                <h2>Top 10 Destination Ports</h2>
                <canvas id="ports-chart"></canvas>
            </div>
            <div class="chart">
                <h2>Packet Size Distribution</h2>
                <canvas id="packet-size-chart"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const socket = io();
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const exportBtn = document.getElementById('export-btn');
        let protocolChart, portsChart, packetSizeChart;

        // Initialize charts
        function initializeCharts() {
            protocolChart = new Chart(document.getElementById('protocol-chart'), {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Protocol Distribution',
                        data: [],
                        backgroundColor: 'rgba(54, 162, 235, 0.5)'
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

            portsChart = new Chart(document.getElementById('ports-chart'), {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Port Usage',
                        data: [],
                        backgroundColor: 'rgba(153, 102, 255, 0.5)'
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

            packetSizeChart = new Chart(document.getElementById('packet-size-chart'), {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Packet Sizes',
                        data: [],
                        borderColor: 'rgba(75, 192, 192, 1)',
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        initializeCharts();

        startBtn.addEventListener('click', function() {
            socket.emit('start_capture');
            startBtn.disabled = true;
            stopBtn.disabled = false;
            exportBtn.disabled = true;
            document.getElementById('alert-count').textContent = '0';
            document.getElementById('alerts-list').innerHTML = '';
        });

        stopBtn.addEventListener('click', function() {
            socket.emit('stop_capture');
            startBtn.disabled = false;
            stopBtn.disabled = true;
            exportBtn.disabled = false;
        });

        exportBtn.addEventListener('click', async function() {
            try {
                const response = await fetch('http://127.0.0.1:5000/server_api/export-pdf'); 
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `network_analysis_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            } catch (error) {
                console.error('Error exporting PDF:', error);
                alert('Failed to export PDF. Please try again.');
            }
        });

        socket.on('update_stats', function(data) {
            document.getElementById('total-packets').textContent = data.total_packets;
            document.getElementById('pps').textContent = data.pps;
            document.getElementById('bandwidth').textContent = data.bandwidth;
            document.getElementById('connections').textContent = data.connections;

            // Update protocol chart
            const protocols = data.protocols;
            protocolChart.data.labels = Object.keys(protocols);
            protocolChart.data.datasets[0].data = Object.values(protocols);
            protocolChart.update();

            // Update ports chart
            const ports = data.ports;
            const sortedPorts = Object.entries(ports)
                .sort(([,a], [,b]) => b - a)
                .slice(0, 10);
            portsChart.data.labels = sortedPorts.map(([port]) => port);
            portsChart.data.datasets[0].data = sortedPorts.map(([,count]) => count);
            portsChart.update();

            // Update packet size chart
            const packetSizes = data.packet_sizes;
            if (packetSizes.length > 50) {
                packetSizes.splice(0, packetSizes.length - 50);
            }
            packetSizeChart.data.labels = Array.from({length: packetSizes.length}, (_, i) => i + 1);
            packetSizeChart.data.datasets[0].data = packetSizes;
            packetSizeChart.update();
        });

        socket.on('dos_alert', function(data) {
            const alertsList = document.getElementById('alerts-list');
            const alertCount = document.getElementById('alert-count');
            
            data.alerts.forEach(alert => {
                const alertElement = document.createElement('div');
                alertElement.className = 'alert';
                alertElement.textContent = `[${data.timestamp}] ${alert}`;
                alertsList.insertBefore(alertElement, alertsList.firstChild);
            });

            const currentCount = parseInt(alertCount.textContent);
            alertCount.textContent = currentCount + data.alerts.length;

            while (alertsList.children.length > 10) {
                alertsList.removeChild(alertsList.lastChild);
            }
        });
    </script>
</body>
</html>
