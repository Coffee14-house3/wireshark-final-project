<!DOCTYPE html>
<html data-bs-theme="dark">
<head>
    <title>Protocol Analyzer</title>
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>
<body class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h2 class="text-center mb-0">
                        <i class="bi bi-file-earmark-binary me-2"></i>
                        Protocol Analysis Tool
                    </h2>
                </div>
                <div class="card-body">
                    <div id="upload-section">
                        <form id="upload-form" class="text-center">
                            <div class="mb-4">
                                <div class="upload-zone p-4 border rounded">
                                    <i class="bi bi-cloud-upload display-4"></i>
                                    <p class="mt-3">Drag & drop your PCAP file here or click to browse</p>
                                    <input type="file" class="form-control" id="file" name="file" accept=".pcap,.pcapng" required>
                                </div>
                                <small class="text-muted">Maximum file size: 50MB</small>
                            </div>
                            <button type="submit" class="btn btn-primary" id="analyze-btn">
                                <i class="bi bi-search me-2"></i>Analyze and Generate Report
                            </button>
                        </form>
                    </div>

                    <div id="progress-section" class="d-none">
                        <div class="text-center">
                            <div class="spinner-border text-primary mb-3" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p id="progress-text">Analyzing PCAP file...</p>
                        </div>
                    </div>

                    <div id="result-section" class="d-none text-center">
                        <div class="alert alert-success">
                            <i class="bi bi-check-circle me-2"></i>
                            Analysis complete!
                        </div>
                        <a href="#" id="download-btn" class="btn btn-success">
                            <i class="bi bi-download me-2"></i>Download Report
                        </a>
                        <button class="btn btn-secondary ms-2" onclick="resetForm()">
                            <i class="bi bi-arrow-counterclockwise me-2"></i>Analyze Another
                        </button>
                    </div>

                    <div id="error-section" class="d-none">
                        <div class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle me-2"></i>
                            <span id="error-message"></span>
                        </div>
                        <button class="btn btn-secondary" onclick="resetForm()">
                            <i class="bi bi-arrow-counterclockwise me-2"></i>Try Again
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('upload-form');
            const uploadSection = document.getElementById('upload-section');
            const progressSection = document.getElementById('progress-section');
            const resultSection = document.getElementById('result-section');
            const errorSection = document.getElementById('error-section');
            const errorMessage = document.getElementById('error-message');
            const downloadBtn = document.getElementById('download-btn');
            const fileInput = document.getElementById('file');
            const uploadZone = document.querySelector('.upload-zone');

            uploadZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadZone.classList.add('border-primary');
            });

            uploadZone.addEventListener('dragleave', () => {
                uploadZone.classList.remove('border-primary');
            });

            uploadZone.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadZone.classList.remove('border-primary');
                
                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    const event = new Event('change');
                    fileInput.dispatchEvent(event);
                }
            });

            fileInput.addEventListener('change', function() {
                const file = this.files[0];
                if (file) {
                    const fileName = file.name;
                    if (file.size > 50 * 1024 * 1024) {
                        showError('File size exceeds 50MB limit');
                        this.value = '';
                        return;
                    }
                    if (!fileName.toLowerCase().endsWith('.pcap') && !fileName.toLowerCase().endsWith('.pcapng')) {
                        showError('Invalid file type. Please select a .pcap or .pcapng file');
                        this.value = '';
                        return;
                    }
                }
            });

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                const formData = new FormData(this);
                showProgress();

                try {
                    const response = await fetch('/upload', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();
                    console.log("Server Response:", data); // Debugging log

                    if (response.ok) {
                        showResult(data.download_url);
                    } else {
                        showError(data.error || 'An error occurred during file processing');
                    }
                } catch (error) {
                    console.error("Error:", error); // Debugging log
                    showError('Network error occurred');
                }
            });

            function showProgress() {
                uploadSection.classList.add('d-none');
                progressSection.classList.remove('d-none');
                resultSection.classList.add('d-none');
                errorSection.classList.add('d-none');
            }

            function showResult(downloadUrl) {
                progressSection.classList.add('d-none');
                resultSection.classList.remove('d-none');
                downloadBtn.href = downloadUrl;
            }

            function showError(message) {
                uploadSection.classList.add('d-none');
                progressSection.classList.add('d-none');
                resultSection.classList.add('d-none');
                errorSection.classList.remove('d-none');
                errorMessage.textContent = message;
            }
        });

        function resetForm() {
            document.getElementById('upload-form').reset();
            document.getElementById('upload-section').classList.remove('d-none');
            document.getElementById('progress-section').classList.add('d-none');
            document.getElementById('result-section').classList.add('d-none');
            document.getElementById('error-section').classList.add('d-none');
        }
    </script>
</body>
</html>
