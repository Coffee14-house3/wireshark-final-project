version: '3.8'

services:
  wireshark-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - SECRET_KEY=wireshark-secret-2024
      - PORT=5000
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - ./backend/reports:/app/reports
    networks:
      - wireshark-network
    restart: unless-stopped

  # Optional: Add a reverse proxy (nginx) for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - wireshark-backend
    networks:
      - wireshark-network
    restart: unless-stopped

networks:
  wireshark-network:
    driver: bridge
