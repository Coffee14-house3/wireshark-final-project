#pcap front end file
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCAP Analyzer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background-color: #1e1e2f;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 700px;
            margin-top: 50px;
        }
        .upload-box {
            border: 2px dashed #5AB0FF;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            border-radius: 10px;
            background-color: #292941;
        }
        .upload-box:hover {
            background-color: #3b3b5b;
        }
        .progress-bar {
            height: 5px;
        }
        .error-message {
            color: #ff6b6b;
            margin-top: 10px;
        }
        .image-container {
            margin-top: 20px;
        }
        .image-container img {
            width: 100%;
            border-radius: 5px;
            margin-top: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center">PCAP File Analyzer</h2>

    <div id="upload-box" class="upload-box">
        <p>Drag & Drop a PCAP file here or click to upload</p>
        <input type="file" id="fileInput" hidden>
    </div>

    <div class="progress mt-3 d-none">
        <div class="progress-bar bg-info" role="progressbar" style="width: 0%"></div>
    </div>

    <div class="text-center mt-3">
        <button id="uploadBtn" class="btn btn-primary" disabled>Analyze File</button>
    </div>

    <p id="error-message" class="error-message"></p>

    <div id="results" class="image-container"></div>
</div>

<script>
    let selectedFile = null;

    document.getElementById("upload-box").addEventListener("click", function() {
        document.getElementById("fileInput").click();
    });

    document.getElementById("fileInput").addEventListener("change", function(event) {
        selectedFile = event.target.files[0];
        validateFile();
    });

    function validateFile() {
        if (!selectedFile) return;
        
        const allowedExtensions = ["pcap", "pcapng", "cap"];
        const fileExtension = selectedFile.name.split('.').pop().toLowerCase();

        if (!allowedExtensions.includes(fileExtension)) {
            document.getElementById("error-message").textContent = "Invalid file type. Please upload a PCAP file.";
            selectedFile = null;
            return;
        }

        document.getElementById("uploadBtn").disabled = false;
        document.getElementById("error-message").textContent = "";
    }

    document.getElementById("uploadBtn").addEventListener("click", function() {
        if (!selectedFile) return;
        
        let formData = new FormData();
        formData.append("file", selectedFile);

        $(".progress").removeClass("d-none");
        $(".progress-bar").css("width", "10%");

        fetch("/upload", {
            method: "POST",
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            $(".progress-bar").css("width", "100%");
            displayResults(data);
        })
        .catch(error => {
            console.error("Upload Error:", error);
            document.getElementById("error-message").textContent = "Error analyzing PCAP file.";
        });
    });

    function displayResults(data) {
        if (data.error) {
            document.getElementById("error-message").textContent = data.error;
            return;
        }

        let resultDiv = document.getElementById("results");
        resultDiv.innerHTML = "";

        for (const [title, img] of Object.entries(data)) {
            let imgElement = document.createElement("img");
            imgElement.src = "data:image/png;base64," + img;
            imgElement.alt = title;
            resultDiv.appendChild(imgElement);
        }
    }
</script>

</body>
</html>
